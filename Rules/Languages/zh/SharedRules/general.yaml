---

# number-sets are a little messy in that the base was converted to a number-set, so we have to match that (simple) case last
- name: pos-neg-number-sets
  tag: number-sets
  match: "count(*)=2 and *[2][.='+' or .='-']"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then:
      - T: ""      # phrase('the' square root of 25 equals 5)
  - bookmark: "*[2]/@id"
  - test:
    - if: "*[2][.='+']"
      then: [T: "正"]      # phrase(set of all 'positive' integers less than 10)
      else: [T: "负"]      # phrase(set of all 'negative' integers less than minus 10)
  - bookmark: "*[1]/@id"
  - test:
    - if: "*[1][.='ℂ']"
      then: [T: "复数集"]      # phrase('complex numbers' consist of two parts)
    - else_if: "*[1][.='ℕ']"
      then: [T: "自然数集"]      # phrase('natural numbers' are numbers from 1 to infinity)
    - else_if: "*[1][.='ℚ']"
      then: [T: "有理数集"]      # phrase('rational numbers' are the fraction of 2 integers)
    - else_if: "*[1][.='ℝ']"
      then: [T: "实数集"]      # phrase('real numbers' can be both positive and negative)
    - else_if: "*[1][.='ℤ']"
      then: [T: "整数集"]      # phrase(positive 'integers' are natural numbers above 0)
      else: [x: "*[1][text()]"] # shouldn't happen

- name: dimension-number-sets

  # should be single digit integer at this point (e.g, R^3)
  tag: number-sets
  match: "count(*)=2"
  replace:
  - bookmark: "*[1]/@id"
  - test:
    - if: "*[1][.='ℂ']"
      then: [T: "C"]      # phrase(the letter 'C' used to represent complex number)
    - else_if: "*[1][.='ℕ']"
      then: [T: "N"]      # phrase(the letter 'N' may represent natural numbers)
    - else_if: "*[1][.='ℚ']"
      then: [T: "Q"]      # phrase(the letter 'Q' may represent rational numbers)
    - else_if: "*[1][.='ℝ']"
      then: [T: "R"]      # phrase(the letter 'R' may represent real numbers)
    - else_if: "*[1][.='ℤ']"
      then: [T: "Z"]      # phrase(the letter 'Z' may represent integers)
      else: [x: "*[1][text()]"] # shouldn't happen
  - bookmark: "*[2]/@id"
  - x: "*[2]"

- name: simple-number-sets
  tag: number-sets
  match: "count(*)=0"
  replace:
  - bookmark: "@id"
  - test:
    - if: ".='ℂ'"
      then: [T: "复数集"]      # phrase('the complex numbers' include 2 parts)
    - else_if: ".='ℕ'"
      then: [T: "自然数集"]      # phrase('the natural numbers' begin at 1)
    - else_if: ".='ℚ'"
      then: [T: "有理数集"]      # phrase('the rational numbers' are the fraction of 2 integers)
    - else_if: ".='ℝ'"
      then: [T: "实数集"]      # phrase('the real numbers' can be both positive and negative)
    - else_if: ".='ℤ'"
      then: [T: "整数集"]      # phrase('the integers' are natural numbers above 0)
      else: [x: "text()"] # shouldn't happen

- name: real-part
  tag: real-part
  match: "count(*)=0"
  replace:
  - bookmark: "@id"
  - T: "实部"      # phrase('the real part' of a complex number does not include the imaginary part)

- name: imaginary-part
  tag: imaginary-part
  match: "count(*)=0"
  replace:
  - bookmark: "@id"
  - T: "虚部"      # phrase('the imaginary part' is part of a complex number)

# rules on scripted vertical bars ('evaluated at')
- name: evaluated-at-2
  tag: evaluate
  match: "count(*)=2"
  replace:
  - x: "*[1]"
  - pause: auto
  - T: "在"      # phrase(results were 'evaluated at' a given point)
  - pause: auto
  - x: "*[2]"
  - T: "处的值"

- name: evaluated-at-3
  tag: evaluate
  match: "count(*)=3"
  replace:
  - x: "*[1]"
  - pause: auto
  - T: "在"      # phrase(results were 'evaluated at' this point)
  - pause: auto
  - x: "*[3]"
  - T: "处的值减去同一表达式在"      # phrase(this result is 'minus the same expression evaluated at' an earlier point)
  - x: "*[2]"
  - T: "处的值"

# Chinese places the result noun after both operands.
- name: quotient # audit-ignore: Chinese places the result noun after both operands.
  tag: quotient
  match: "count(*)=2"
  replace:
  - x: "*[1]"
  - T: "除以"
  - x: "*[2]"
  - T: "的商"

- name: remainder # audit-ignore: Chinese places the result noun after both operands.
  tag: remainder
  match: "count(*)=2"
  replace:
  - x: "*[1]"
  - T: "除以"
  - x: "*[2]"
  - T: "的余数"

# Chinese puts the argument before a quantity or property that belongs to it.
- name: argument-owned-function
  tag: [inverse, domain, codomain, image, max, min, complex-conjugate, complex-arg, real-part, imaginary-part, fractional-part, complement, cardinality, probability, volume, chemistry-concentration]
  match: "count(*)=1"
  replace:
  - x: "*[1]"
  - test:
    - if: "self::m:inverse"
      then: [T: "的逆"]
    - else_if: "self::m:domain"
      then: [T: "的定义域"]
    - else_if: "self::m:codomain"
      then: [T: "的陪域"]
    - else_if: "self::m:image"
      then: [T: "的像"]
    - else_if: "self::m:max"
      then: [T: "的最大值"]
    - else_if: "self::m:min"
      then: [T: "的最小值"]
    - else_if: "self::m:complex-conjugate"
      then: [T: "的共轭复数"]
    - else_if: "self::m:complex-arg"
      then: [T: "的辐角"]
    - else_if: "self::m:real-part"
      then: [T: "的实部"]
    - else_if: "self::m:imaginary-part"
      then: [T: "的虚部"]
    - else_if: "self::m:fractional-part"
      then: [T: "的小数部分"]
    - else_if: "self::m:complement"
      then: [T: "的补集"]
    - else_if: "self::m:cardinality"
      then: [T: "的基数"]
    - else_if: "self::m:probability"
      then: [T: "的概率"]
    - else_if: "self::m:volume"
      then: [T: "的体积"]
      else: [T: "的浓度"]

- name: rounding-function
  tag: [floor, ceiling, round]
  match: "count(*)=1"
  replace:
  - x: "*[1]"
  - test:
    - if: "self::m:floor"
      then: [T: "向下取整"]
    - else_if: "self::m:ceiling"
      then: [T: "向上取整"]
      else: [T: "四舍五入后的值"]

- name: common-divisor-and-multiple
  tag: [greatest-common-divisor, least-common-multiple]
  match: "count(*)=2"
  replace:
  - x: "*[1]"
  - T: "与"
  - x: "*[2]"
  - test:
      if: "self::m:greatest-common-divisor"
      then: [T: "的最大公约数"]
      else: [T: "的最小公倍数"]

- name: conditional-probability
  tag: conditional-probability
  match: "count(*)=2"
  replace:
  - T: "在"
  - x: "*[2]"
  - T: "条件下"
  - x: "*[1]"
  - T: "的概率"

- name: set-difference
  tag: set-difference
  match: "count(*)=2"
  replace:
  - x: "*[1]"
  - T: "与"
  - x: "*[2]"
  - T: "的差集"

- name: least-common-denominator
  tag: least-common-denominator
  match: "count(*)=2 or count(*)=3"
  replace:
  - x: "*[1]"
  - test:
      if: "count(*)=3"
      then: [pause: short, x: "*[2]"]
  - T: "与"
  - x: "*[last()]"
  - T: "的最小公分母"

- name: permutation
  # Not a default because the order of the args is reversed
  tag: pochhammer
  match: "count(*)=2 and contains(@data-intent-property, ':infix:')"
  replace:
  - x: "*[1]"
  - T: "取"
  - x: "*[2]"
  - T: "的排列数"

- name: intervals
  variables:
  - is_intervals_start_infinity: "*[1][self::m:minus and count(*)=1 and *[1][.='∞']]"
  - is_intervals_end_infinity: "*[2][.='∞' or (self::m:plus and count(*)=1 and *[1][.='∞'])]"
  - is_intervals_end_positive_infinity: "*[2][self::m:plus and count(*)=1 and *[1][.='∞']]"
  tag: [open-interval, open-closed-interval, closed-interval, closed-open-interval]
  match: "count(*)=2"
  replace:
  - test:
    - if: "$is_intervals_start_infinity and $is_intervals_end_infinity"
      then: [T: "实数集"]
    - else_if: "$is_intervals_start_infinity"
      then:
      - T: "从负无穷大到"
      - x: "*[2]"
      - T: "的区间"
      - pause: short
      - test:
          if: "name(.) = 'closed-interval' or name(.) = 'open-closed-interval'"
          then: [T: "包括端点"]
          else: [T: "不包括端点"]
      - x: "*[2]"
    - else_if: "$is_intervals_end_infinity"
      then:
      - T: "从"
      - x: "*[1]"
      - test:
          if: "$is_intervals_end_positive_infinity"
          then: [T: "到正无穷大的区间"]
          else: [T: "到无穷大的区间"]
      - pause: short
      - test:
          if: "name(.) = 'closed-interval' or name(.) = 'closed-open-interval'"
          then: [T: "包括端点"]
          else: [T: "不包括端点"]
      - x: "*[1]"
      else:
      - test:
        - if: "name(.) = 'open-interval'"
          then: [T: "开区间"]
        - else_if: "name(.) = 'closed-interval'"
          then: [T: "闭区间"]
        - else_if: "name(.) = 'open-closed-interval'"
          then: [T: "左开右闭区间"]
          else: [T: "左闭右开区间"]
      - x: "*[1]"
      - T: "到"
      - x: "*[2]"

- name: default-point
  tag: point
  match: "count(*)=2"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then:
      - T: ""      # phrase('the' square root of 25 equals 5)
  - T: "点"      # phrase(a decimal 'point' indicates the fraction component of a number)
  - x: "*[1]"
  - T: "逗号"      # phrase(use a 'comma' to divide large numbers or as a decimal point)
  - x: "*[2]"

- name: absolute-value # audit-ignore: Chinese places the function name after its argument.
  # order of speech is different from 'function'
  tag: absolute-value
  match: "count(*)=1"
  replace:
  - x: "*[1]"
  - T: "的绝对值"

- name: bigop-both
  tag: large-op
  match: "count(*) = 3"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: ""]      # phrase('the' square root of 25 equals 5)
  - x: "*[1]"
  - T: "从"      # phrase(subtracting 5 'from' 10 gives 5)
  - x: "*[2]"
  - T: "到"      # phrase(adding 6 'to' 6 equals  12)
  - x: "*[3]"
  - test:
      if: "following-sibling::*"
      then: [T: ""]      # Chinese does not need an equivalent of "of" here.

- name: bigop-under
  tag: large-op
  match: "count(*)=2"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: ""]      # phrase('the' square root of 25 equals 5)
  - x: "*[1]"
  - T: "下限为"      # phrase(2 'over' 3 equals two thirds)
  - x: "*[2]"
  - test:
      if: "following-sibling::*"
      then: [T: ""]      # Chinese does not need an equivalent of "of" here.

- name: largeop
  tag: mrow
  match: "count(*)=2 and IsInDefinition(*[1], 'LargeOperators')"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: ""]      # phrase('the' square root of 25 equals 5)
  - x: "*[1]"
  - T: ""      # Chinese does not need an equivalent of "of" here.
  - x: "*[2]"

- name: repeating-decimal
  tag: repeating-decimal
  match: "."
  replace:
  - x: "*[1]"
  - T: "循环节为"      # phrase('with repeating digits')
  - SPELL: "*[2]"

- name: angle-measure # audit-ignore: Chinese places the degree phrase after the angle name.
  tag: [angle-measure, measured-angle]
  match: "count(*)=1 and contains(@data-intent-property, ':prefix:')"
  replace:
  - T: "角"
  - x: "*[1]"
  - T: "的度数"

- name: msubsup-skip-super
  # handles single, double, etc., prime
  tag: [skip-super, say-super]
  match: "count(*)=3"
  replace:
  - x: "*[1]"
  - test:
      if: "$Verbosity='Verbose'"
      then: [T: "下标"]      # phrase(a 'subscript' may be used to indicate an index)
      else: [T: "下标"]      # phrase(the result is 'sub' optimal)
  - x: "*[2]"
  - test:
      if: "not(IsNode(*[2],'leaf') and $Impairment = 'Blindness')"
      then:
      - test:
          if: "$Verbosity='Verbose'"
          then: [T: "结束下标"]      # phrase(this is the 'end subscript' position)
          else: [T: "结束下标"]      # phrase(this is the 'end sub' position)
      - pause: short
      else_test:
          if: "*[2][self::m:mi]"   # need a pause in "x sub k prime" so the prime is not associated with the 'k'
          then: [pause: short]
  - test:
      if: "name(.)='say-super'"
      then_test:
        if: "$Verbosity='Verbose'"
        then: [T: "上标"]      # phrase(a 'superscript' number indicates raised to a power)
        else: [T: "上标"]      # phrase(this is a 'super' set of numbers)
  - x: "*[3]"
  - pause: short

# in terse mode, we just say "m" or "s", etc., not meters or seconds
- name: unit-terse
  tag: unit
  match: "$Verbosity = 'Terse' and string-length(.)=1"
  replace:
  - bookmark: "@id"
  - SPELL: "text()"

# the order of matching is
# 1. does it match the base of an SI unit
# 2. does it match an English unit (if in an English language)
# 3. does it match an SI prefix followed by an SI that accepts SI prefixes
# Due to this order, some things like "ft" and "cd" mean "feet" vs "femto-tonnes" and "pints" vs "pico-tonnes"
- name: unit
  tag: unit
  match: "."
  variables:
    # If the coefficient is singular, we don't add the plural ending. Finding the coefficient is tricky
    # Normal case (A) "3m" (parents is mrow), but could also be (B) "3 m^2" (etc.) (parent is power/mrow)
    # But it might be in a fraction as (C) "3 m/s" (parent is fraction/mrow) or (D) "3 m^2/s^2" (parent is power/fraction/mrow)
    #   or even (E) {3 m^2}/s (parent is power/mrow)
    # If in a fraction, only look in the numerator to find the coefficient
    # Note: we have a special case for pseudo-scripts like "°" (degrees) which are not powers -- they are essentially "1^°"
    # The following "IfThenElse" logic returns the mrow that potentially contains the coefficient, if it exists
    # The tests are in the order A, B & E, C, D
  - MRowForCoefficient: "IfThenElse(parent::m:mrow, parent::m:mrow,
                         IfThenElse(parent::m:power, ancestor::*[2][self::m:mrow],
                         IfThenElse(parent::m:fraction and not(preceding-sibling::*), ancestor::*[2][self::m:mrow],
                         IfThenElse(parent::m:power[parent::m:fraction and not(preceding-sibling::*)], ancestor::*[3][self::m:mrow], false()) ) ) )"
  - IsSingular: "(not($MRowForCoefficient) and parent::*[name(.)!='skip-super' or *[1][.=1]]) or
                 ($MRowForCoefficient and $MRowForCoefficient[(count(*) = 3 and *[1][self::m:mn and .=1] and *[2]='\u2062')])"
  - Prefix: "''"
  - Word: "''"  
  replace:
  - bookmark: "@id"
  - test:
    # is the whole string match a SI Unit without a prefix?
    - if: "DefinitionValue(., 'Speech', 'SIUnits') != ''"
      then:
      - set_variables: [Word: "DefinitionValue(., 'Speech', 'SIUnits')"]
    - else_if: "DefinitionValue(., 'Speech', 'UnitsWithoutPrefixes') != ''"
      then:
      - set_variables: [Word: "DefinitionValue(., 'Speech', 'UnitsWithoutPrefixes')"]
    - else_if: "DefinitionValue(., 'Speech', 'EnglishUnits') != ''"
      then:
      - set_variables: [Word: "DefinitionValue(., 'Speech', 'EnglishUnits')"]

    # do the first two chars match "da" and the remainder match an SIUnit
    - else_if: "string-length(.) >= 3 and 
                substring(., 1, 2) = 'da' and
                DefinitionValue(substring(., 3), 'Speech', 'SIUnits') != ''"
      then:
      - set_variables:
        - Prefix: "DefinitionValue('da', 'Speech', 'SIPrefixes')"
        - Word: "DefinitionValue(substring(., 3), 'Speech', 'SIUnits')"

    # does the first char match a prefix and the remainder match an SIUnit
    - else_if: "string-length(.) >= 2 and 
                DefinitionValue(substring(., 1, 1), 'Speech', 'SIPrefixes') != ''  and
                DefinitionValue(substring(., 2), 'Speech', 'SIUnits') != ''"
      then:
      - set_variables:
        - Prefix: "DefinitionValue(substring(., 1, 1), 'Speech', 'SIPrefixes')"
        - Word: "DefinitionValue(substring(., 2), 'Speech', 'SIUnits')"

    # not a known unit -- just speak the text, possibly as a plural
    - else:
      - set_variables:
        - Word: "text()"

  # somewhat complicated logic to avoid spaces around "-" as in "centi-grams" vs "centi - grams" -- probably doesn't matter
  - test:
      if: "$Prefix = ''"
      then:
      - test:
        - if: "$IsSingular"
          # HACK: '\uF8FE' is used internally for the concatenation char by 'ct' -- this gets the prefix concatinated to the base
          then: [x: "$Word"]
        - else_if: "DefinitionValue($Word, 'Speech', 'PluralForms') != ''"
          then: [x: "DefinitionValue($Word, 'Speech', 'PluralForms')"]
          else: [x: "$Word"]
      else:
      - x: "$Prefix"
      - CT: ""
      - test:
        - if: "$IsSingular"
          # HACK: '\uF8FE' is used internally for the concatenation char by 'ct' -- this gets the prefix concatinated to the base
          then: [x: "concat('\uF8FE', $Word)"]
        - else_if: "DefinitionValue($Word, 'Speech', 'PluralForms') != ''"
          then: [x: "concat('\uF8FE', DefinitionValue($Word, 'Speech', 'PluralForms'))"]
          else: [x: "concat('\uF8FE', $Word)"]

# need to reverse the order of speech: $ 3 -> 3 dollars
- name: currency
  tag: mrow
  match: "count(*)=3 and DefinitionValue(*[1], 'Speech', 'CurrencySymbols') != ''"
  variables:
    # If the amount is singular, we don't add the plural ending.
  - IsSingular: "*[3][self::m:mn and .=1] and *[2]='\u2062'"
  - CurrencyWord: "DefinitionValue(*[1], 'Speech', 'CurrencySymbols')"
  replace:
  - bookmark: "*[3]/@id"
  - x: "*[3]"
  - test:
    - if: "$IsSingular"
      then: [x: "$CurrencyWord"]
    - else_if: "DefinitionValue($CurrencyWord, 'Speech', 'PluralForms') != ''"
      then: [x: "DefinitionValue($CurrencyWord, 'Speech', 'PluralForms')"]
      else: [x: "DefinitionValue(*[1], 'Speech', 'CurrencySymbols')", CT: ""]

- name: sin
  tag: mi
  match: ".='sin'"
  replace:
  - bookmark: "@id"
  - T: "正弦"      # phrase(the 'sine' of the angle)
- name: cos
  tag: mi
  match: ".='cos'"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "余弦"]      # phrase('cos' is the abbreviation for cosine)
      else: [T: "余弦"]      # phrase(find the 'cosine' in a right-angle triangle)
- name: tan
  tag: mi
  match: ".='tan' or .='tg'"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "正切"]      # phrase(the 'tan' is the ratio of the opposite to the adjacent side of a right-angled triangle)
      else: [T: "正切"]      # phrase(a 'tangent' is a straight line that touches a curve)
- name: sec
  tag: mi
  match: ".='sec'"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "正割"]      # phrase(to 'seek' a solution)
      else: [T: "正割"]      # phrase(a 'secant' intersects a curve at two or more points)
- name: csc
  tag: mi
  match: ".='csc'"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "余割"]      # phrase(we will 'cosecant' a solution)
      else: [T: "余割"]      # phrase(the 'cosecant' is the reciprocal of the secant)
- name: cot
  tag: mi
  match: ".='cot'"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "余切"]      # phrase(find the 'cotangent' in a right-angle triangle)
      else: [T: "余切"]      # phrase(the 'cotangent' is the reciprocal of the tangent)

- name: sinh
  tag: mi
  match: ".='sinh'"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "双曲正弦"]      # phrase(the word 'sinch' is an abbreviation for hyperbolic sine)
      else: [T: "双曲正弦"]      # phrase(the 'hyperbolic sine' is used in mathematics)
- name: cosh
  tag: mi
  match: ".='cosh'"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "双曲余弦"]      # phrase('cosh' is an abbreviation of hyperbolic cosine)
      else: [T: "双曲余弦"]      # phrase(the 'hyperbolic cosine' is a mathematical function)
- name: tanh
  tag: mi
  match: ".='tanh'"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "双曲正切"]      # phrase('tanch' is shorthand for hyperbolic tangent)
      else: [T: "双曲正切"]      # phrase('hyperbolic tangent' is a mathematical function)
- name: sech
  tag: mi
  match: ".='sech'"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "双曲正割"]      # phrase('sheck' is shorthand for hyperbolic secant)
      else: [T: "双曲正割"]      # phrase('hyperbolic secant' is a mathematical function)
- name: csch
  tag: mi
  match: ".='csch'"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "双曲余割"]      # phrase('cosheck' is shorthand for hyperbolic cosecant)
      else: [T: "双曲余割"]      # phrase('hyperbolic cosecant' is a mathematical function)
- name: coth
  tag: mi
  match: ".='coth'"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "双曲余切"]      # phrase('cotanch' is shorthand for hyperbolic cotangent)
      else: [T: "双曲余切"]      # phrase(the 'hyperbolic cotangent' is a mathematical function)

- name: exponential
