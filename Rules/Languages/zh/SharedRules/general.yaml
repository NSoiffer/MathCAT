  match: ".='exp'"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "指数函数"]      # phrase('exp' means exponential function)
      else: [T: "指数函数"]      # phrase('exponential' function)

- name: covariance
  tag: mi
  match: ".='Cov'"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "协方差"]      # phrase('Cov' is shorthand for the covariance function)
      else: [T: "协方差"]      # phrase('covariance' function)

- name: statistics
  tag: [mean, standard-deviation, variance, median, mode]
  match: "count(*)=1"
  replace:
  - x: "*[1]"
  - test:
    - if: "self::m:mean"
      then: [T: "的平均值"]
    - else_if: "self::m:standard-deviation"
      then: [T: "的标准差"]
    - else_if: "self::m:variance"
      then: [T: "的方差"]
    - else_if: "self::m:median"
      then: [T: "的中位数"]
      else: [T: "的众数"]


-
  name: log    # handle log, principal Log, and ln (if in an mrow, 'intents' are used)
  tag: mi
  match: ".='log' or .='Log' or .='ln'"
