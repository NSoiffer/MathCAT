  replace:
  - with:
      variables: [SayCommand: "string($NavVerbosity = 'Verbose')"]
      replace: [x: "."]
  - test:
      if: "$NavVerbosity = 'Verbose'"
      then:
      - T: "第"                               # phrase(the first 'column' in the table)
      - x: "count(preceding-sibling::*)"
      - T: "列"
      - pause: short
  - test:
      if: "$NavMode = 'Character'"
      then:
      - with:
