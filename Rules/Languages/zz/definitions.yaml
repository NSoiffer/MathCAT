---
- include: "../../definitions.yaml"
# Lines starting with "#" are a comment
# Each definition in this file is of the form
# - name: { "...", "..." "..." }
# For numbers, 
# - name: [] "...", "..." "..." ]


# IntentMappings Syntax:
#
# This section defines how each "intent" is spoken for various grammatical forms (fixities such as "prefix", "infix", "postfix", and "function"),
#  along with supporting different verbosity levels.
# The syntax is a little bit complicated, but allows a declarative syntax so you don't have to write as many rules.
#
# For each intent, you specify spoken forms for one or more fixities using the syntax below.
#
# - Each mapping has the form:
#     "<intent>": "<fixity1>=<speech1> || <fixity2>=<speech2> || ...",
#   Every alternative must name a fixity and use "="; the fixity requested when speaking selects one.
#
# - Separate multiple fixities with "||". Spaces are allowed around any delimiter for readability.
# - Within a speech string, "|" selects the verbosity form:
#     - one "|"  (two forms):   the first is 'terse', the second is used for 'medium' and 'verbose'
#     - two "|"  (three forms): 'terse', 'medium', 'verbose', in that order
#     - no "|":                 the same spoken form is used for all verbosity levels
#
# - Use semicolons ";" to divide opening; main; closing bracketing words within the name part,
#   where such words make sense (a name with no ";" is just the main phrase).
# - If an intent has multiple fixities but a definition does not specify one, the first fixity listed is chosen by default.
#
# Functions and argument glue (the part after the name):
# - ":" separates the name/bracketing phrase from the argument-glue options that follow it.
# - Arity template (two or more ":" options, or one option with ','-separated glue words): the
#   number of glue words implies the arity, and the final argument is preceded by "of".
#   Example: "sum: over: from,to"
#      - 1 arg:  "sum of x"
#      - 2 args: "sum over i of x"
#      - 3 args: "sum from i to n of x"
#   If no option matches the argument count, the arguments are separated with "comma".
# - Binary separator (exactly one ":" option, no commas in it): after "of", that word joins the two args.
#   Example: "quotient": "function=integer part: divided by" → "integer part of x divided by y"
#   If there are not exactly two args, the arguments fall back to "comma".
# - Paired "ratio-style" ("<name> : <glue> | <name2> : <glue2> | ..."): used when every "|"-separated
#   piece is a single "name : glue" pair. Verbosity selects one pair, whose glue is the binary
#   separator described above. Example: "ratio": "function=ratio : to | the ratio : to | the ratio : to"
#
# Conceptual grammar (with precedence):
#
#   IntentMappingsEntry ::= <intent> ":" <intent_speech>          # ":" is the YAML key/value separator
#
#   <intent_speech> ::= <fixity_speech> ( "||" <fixity_speech> )*
#
#   <fixity_speech> ::= <fixity> "=" <fixity_body>
#
#   <fixity> ::= "prefix" | "infix" | "postfix" | "function" | "nofix" | "silent"
#
#   <fixity_body> ::= <standard_body> | <paired_body>
#
#   # Standard form: a name/bracketing part, then ":"-separated argument-glue options.
#   <standard_body> ::= <speech_part> ( ":" <arg_glue> )*
#
#   <speech_part> ::= <segment> [ ";" <segment> ";" <segment> ]   # 1 part: name; 3 parts: opening; main; closing
#
#   <segment>  ::= <word> [ "|" <word> [ "|" <word> ] ]           # terse | medium | verbose
#
#   <arg_glue> ::= <segment>                                      # a single glue word, or ","-separated arity words
#
#   # Paired "ratio-style" form: recognized only when every "|" piece is a single "name : glue" pair.
#   <paired_body> ::= <pair> ( "|" <pair> )+
#
#   <pair> ::= <word> ":" <word>                                 # the glue <word> contains no ":"
#
#   <word> ::= text
#
# Precedence depends on the form:
#   - Standard: split on ":" first (name vs. argument-glue options), then split each piece on "|"
#     for terse|medium|verbose, and split only the name part on ";" for opening; main; closing.
#   - Paired: split on "|" first into "name : glue" pairs, then verbosity selects one pair.
#
# Example:
#   "absolute-value": "function= ; absolute value| the absolute value| the absolute value; end absolute value"
#   "sum": "function=sum: over: from,to"
#   "quotient": "function=integer part: divided by"
#   "ratio": "function=ratio : to | the ratio : to | the ratio : to"  # verbosity of name:glue pairs
#
- IntentMappings: {
    "absolute-value": "function=absolute value",
    "binomial": "infix=binomial; choose; end binomial",
    "closed-interval": "other=closed-interval;from,to;end closed-interval",
    "dot-product": "infix=dot|dot product|dot product",
    "greatest-common-divisor": "function=gcd| the gcd| the greatest common divisor",
    "imaginary-part": "function=imaginary part, the imaginary part, the imaginary part",
    "least-common-multiple": "function=lcm|the lcm|the least common multiple",
    "large-op:2": "infix=over",
    "large-op:3": "other=from,to",
    "real-part": "function=the real part",
    "transpose": "postfix=transpose || function=transpose",

    "divergence": "function= ; div| divergence| divergence; end divergence",
    "curl": "function= ; curl; end curl",
    "gradient": "function= ; grad| gradient| gradient; end gradient",
    "laplacian": "function=lahplahsian",   # speech engines don't do a good job with "laplacian"
  }

- NavigationParts: {
    "large-op": "base; lower limit; upper limit",
    "mfrac": "numerator;denominator",
    "fraction": "numerator;denominator",
    "msqrt": "root",
    "square-root": "root",
    "mroot": "root;root index",
    "root": "root;root index",
    "msub": "base;subscript",
    "sub": "base;subscript",
    "msup": "base;superscript",
    "say-super": "base;superscript",
    "skip-super": "base;superscript",
    "power": "base;exponent",
    "msubsup": "base;subscript;superscript",
    "munder": "base;under limit",
    "mover": "base;upper limit",
    "munderover": "base;under limit;upper limit",

    # words for moving into and out of one of the parts (e.g., "move right 'out of' numerator, 'in' denominator")
    # it's a hack to put them here, but at least they are grouped with the other navigation parts
    "in": "in",
    "out": "out of",
  }

# ----------------  Cardinal and Ordinal Numbers  --------------------------
# The following definitions are used to convert numbers to words
# The are mainly used for ordinals, of which there are two cases:
# 1. Regular ordinals: first, second, third, ...
# 2. Ordinals used in the denominator of fractions (e.g, one half, one third)
#    When used in the denominator of fractions, a plural version might be
#    used (e.g., two halves, two thirds)
# Although a lot of languages are regular after a few entries, for generality,
# the following lists should be filled out even though they are the same
# or easily derived from others in many languages (e.g, an 's' is added for plurals).
# The larger ordinal numbers (e.g, millionth) is used when there are only
# '0's after that decimal place (e.g., 23000000).:w

# All definitions start 0, 10, 100, etc.

# The definitions for the "ones" should extend until a regular pattern begins
#   The minimum length is 10.

# For English, a regular pattern starts at twenty
- NumbersOnes: [
        "zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine",
        "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen",
        "seventeen", "eighteen", "nineteen"
    ]

- NumbersOrdinalOnes: [
        "zeroth", "first", "second", "third", "fourth", "fifth", "sixth", "seventh", "eighth", "ninth",
        "tenth", "eleventh", "twelfth", "thirteenth", "fourteenth", "fifteenth", "sixteenth",
        "seventeenth", "eighteenth", "nineteenth"
    ]

- NumbersOrdinalPluralOnes: [
        "zeroth", "first", "seconds", "thirds", "fourths", "fifths", "sixths", "sevenths", "eights", "ninths",
        "tenths", "elevenths", "twelfths", "thirteenths", "fourteenths", "fifteenths", "sixteenths",
        "seventeenths", "eighteenths", "nineteenths"
    ]

    # stop when regularity begins
- NumbersOrdinalFractionalOnes: [
        "zero", "first", "half"
    ]

    # stop when regularity begins
- NumbersOrdinalFractionalPluralOnes: [
        "zeros", "firsts", "halves"
    ]


    # What to use for multiples of 10
- NumbersTens: [
        "", "ten", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"
    ]

- NumbersOrdinalTens: [
        "", "tenth", "twentieth", "thirtieth", "fortieth", "fiftieth", "sixtieth", "seventieth", "eightieth", "ninetieth"
    ]

- NumbersOrdinalPluralTens: [
        "", "tenths", "twentieths", "thirtieths", "fortieths", "fiftieths", "sixtieths", "seventieths", "eightieths", "ninetieths"
    ]


- NumbersHundreds: [
      "", "one hundred", "two hundred", "three hundred", "four hundred", "five hundred",
        "six hundred", "seven hundred", "eight hundred", "nine hundred"
    ]

- NumbersOrdinalHundreds: [
      "", "one hundredth", "two hundredth", "three hundredth", "four hundredth", "five hundredth",
        "six hundredth", "seven hundredth", "eight hundredth", "nine hundredth"
    ]

- NumbersOrdinalPluralHundreds: [
      "", "one hundredths", "two hundredths", "three hundredths", "four hundredths", "five hundredths",
        "six hundredths", "seven hundredths", "eight hundredths", "nine hundredths"
    ]
      

    # At this point, hopefully the language is regular. If not, code needs to be written
- NumbersLarge: [
        "", "thousand", "million", "billion", "trillion", "quadrillion",
        "quintillion", "sextillion", "septillion", "octillion", "nonillion",
    ]
      
- NumbersOrdinalLarge: [
        "", "thousandth", "millionth", "billionth", "trillionth", "quadrillionth",
        "quintillionth", "sextillionth", "septillionth", "octillionth", "nonillionth"
    ]
      
- NumbersOrdinalPluralLarge: [
        "", "thousandths", "millionths", "billionths", "trillionths", "quadrillionths",
        "quintillionths", "sextillionths", "septillionths", "octillionths", "nonillionths"
    ]
