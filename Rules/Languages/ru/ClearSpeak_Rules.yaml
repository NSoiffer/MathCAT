---
- name: capital-letter-function-none
  tag: mi
  match: "string-length(.)=1 and contains('ABCDEFGHIJKLMNOPQRSTUVWXYZ', text()) and $ClearSpeak_Functions='None' and following-sibling::*[1][.='⁢' and @data-function-guess]"
  replace:
  - x: "translate(text(), 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz')"
  - T: "большое"

- name: pause
  tag: "!*"
  match: "not(self::m:math) and not($MatchingPause) and @data-intent-property[contains(., ':pause')]"
  replace:
   - with:
      variables: [MatchingPause: "true()"]
      replace:
      - test:
        - if: "contains(@data-intent-property, ':pause-long')"
          then: [pause: long]
        - else_if: "contains(@data-intent-property, ':pause-short')"
          then: [pause: short]
          else: [pause: medium]
      - x: "."

- name: intent-literal-silent
  tag: [mi, mo, mn]
  match: "contains(@data-intent-property, ':silent:')"
  replace: []

- name: intent-literal-negative-number
  tag: mn
  match: "starts-with(text(), '-')"
  replace:
  - T: "минус"
  - x: "translate(text(), '-_', '')"

- name: even-number-text
  tag: mtext
  match: "contains(., 'even') and contains(., 'number')"
  replace:
  - T: "икс — чётное число"

- name: default
  tag: square-root
  match: "."
  replace:
  - T: "квадратный корень"
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: "из"]
      else: [pause: short]
  - test:
      if: "not(IsNode(*[1], 'simple'))"
      then: [T: "выражения"]
  - x: "*[1]"
  - test:
    - if: "$ClearSpeak_Roots = 'RootEnd' or $ClearSpeak_Roots = 'PosNegSqRootEnd'"
      then:
      - pause: short
      - T: "конец корня"
      - pause: medium
    - else_if: "IsNode(*[1], 'simple')"
      then:
      - test:
          if: "(following-sibling::* or parent::m:minus/following-sibling::*) and $ClearSpeak_Roots = 'PosNegSqRoot'"
          then: [pause: long]
      - test:
          if: "(following-sibling::* or parent::m:minus/following-sibling::*) and not($ClearSpeak_Roots = 'PosNegSqRoot')"
          then: [pause: medium]
          else: [pause: short]
      else: [pause: long]

- name: default
  tag: root
  match: "."
  replace:
  - test:
      if: "parent::m:minus and preceding::m:square-root and $ClearSpeak_Roots = 'PosNegSqRootEnd'"
      then: [pause: short]
  - test:
      if: "*[2][.='3'] and $ClearSpeak_Roots = 'PosNegSqRootEnd'"
      then: [pause: short]
  - test:
      if: "*[2][self::m:mn and not(contains(., '.'))]"
      then_test:
      - if: "*[2][.='2']"
        then: [T: "квадратный корень"]
      - else_if: "*[2][.='3']"
        then: [T: "кубический корень"]
      - else: [T: "корень", x: "ToOrdinal(*[2])", T: "степени"]
      else:
      - T: "корень степени"
      - x: "*[2]"
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: "из"]
  - test:
      if: "not(IsNode(*[1], 'simple'))"
      then: [T: "выражения"]
  - x: "*[1]"
  - test:
      if: "$ClearSpeak_Roots = 'RootEnd' or $ClearSpeak_Roots = 'PosNegSqRootEnd'"
      then:
      - pause: short
      - T: "конец корня"
      - pause: medium
      else_test:
        if: IsNode(*[1], 'simple')
        then:
        - test:
            if: "(following-sibling::* or parent::m:minus/following-sibling::*) and $ClearSpeak_Roots = 'PosNegSqRoot'"
            then: [pause: long]
        - test:
            if: "(following-sibling::* or parent::m:minus/following-sibling::*) and not($ClearSpeak_Roots = 'PosNegSqRoot')"
            then: [pause: medium]
            else: [pause: short]
        else: [pause: long]

- name: negative_and_positive
  tag: [plus, minus]
  match: "count(*)=1 and contains(@data-intent-property, ':prefix:')"
  replace:
  - bookmark: "@id"
  - test:
      if: "self::m:minus"
      then: [T: "минус"]
      else: [T: "плюс"]
  - test:
      if: "self::m:minus and *[1][self::m:root] and $ClearSpeak_Roots = 'PosNegSqRootEnd'"
      then: [pause: short]
  - x: "*[1]"

- name: per-fraction
  tag: fraction
  match:
  - "$ClearSpeak_Fractions='Per' or"
  - "(BaseNode(*[1])[contains(@data-intent-property, ':unit') or"
  - "               (self::m:mrow and count(*)=3 and *[1][self::m:mn] and *[2][.='⁢'] and BaseNode(*[3])[contains(@data-intent-property, ':unit')])] and"
  - " BaseNode(*[2])[contains(@data-intent-property, ':unit')])"
  replace:
  - x: "*[1]"
  - test:
      if: "BaseNode(*[2])[contains(@data-intent-property, ':unit')] and BaseNode(*[2])[.='h' or .='hr' or .='Hr']"
      then: [T: "в"]
      else_test:
        if: "BaseNode(*[2])[contains(@data-intent-property, ':unit')]"
        then: [T: "на"]
        else: [T: "разделить на"]
  - test:
      if: "BaseNode(*[2])[contains(@data-intent-property, ':unit')] and BaseNode(*[2])[.='mi']"
      then: [T: "милю"]
      else: [x: "*[2]"]

- name: common-fraction
  tag: fraction
  match:
  - "($ClearSpeak_Fractions='Auto' or $ClearSpeak_Fractions='Ordinal' or $ClearSpeak_Fractions='EndFrac') and"
  - "*[1][self::m:mn][not(contains(., '.')) and ($ClearSpeak_Fractions='Ordinal' or text()<20)]   and"
  - "*[2][self::m:mn][not(contains(., '.')) and ($ClearSpeak_Fractions='Ordinal' or (2<= text() and text()<=10))]"
  variables: [IsPlural: "*[1]!=1"]
  replace:
  - test:
    - if: "DefinitionValue(*[1], 'Speech', 'FractionNumerators') != ''"
      then: [x: "DefinitionValue(*[1], 'Speech', 'FractionNumerators')"]
      else: [x: "*[1]"]
  - x: "ToOrdinal(*[2], true(), $IsPlural)"

- name: common-fraction-mixed-number
  tag: fraction
  match:
  - "preceding-sibling::*[1][self::m:mo][.='⁤'] and"
  - "($ClearSpeak_Fractions='Auto' or $ClearSpeak_Fractions='Ordinal' or $ClearSpeak_Fractions='EndFrac') and"
  - "*[1][self::m:mn][not(contains(., '.')) and ($ClearSpeak_Fractions='Ordinal' or text()<20)]   and"
  - "*[2][self::m:mn][not(contains(., '.')) and ($ClearSpeak_Fractions='Ordinal' or (2<= text() and text()<=10) or text()=83)]"
  variables: [IsPlural: "*[1]!=1"]
  replace:
  - test:
    - if: "DefinitionValue(*[1], 'Speech', 'FractionNumerators') != ''"
      then: [x: "DefinitionValue(*[1], 'Speech', 'FractionNumerators')"]
      else: [x: "*[1]"]
  - test:
      if: "*[2][.='83']"
      then: [T: "восемьдесят третьих"]
      else: [x: "ToOrdinal(*[2], true(), $IsPlural)"]

- name: fraction-over-simple
  tag: fraction
  match:
  - "($ClearSpeak_Fractions='Over' or $ClearSpeak_Fractions='FracOver' or $ClearSpeak_Fractions='OverEndFrac') or"
  - "( not($ClearSpeak_Fractions='General' or $ClearSpeak_Fractions='GeneralEndFrac') and"
  - "  (IsNode(*[1],'simple') and IsNode(*[2],'simple')) )"
  replace:
  - test:
      if: "$ClearSpeak_Fractions='FracOver'"
      then:
      - test:
          if: "$Verbosity!='Terse'"
          then: [ot: ""]
      - T: "дробь"
  - x: "*[1]"
  - test:
      if: "$ClearSpeak_Fractions='Auto' and $Verbosity='Medium' and *[1][self::m:mrow and (*[2][.='('] or (*[2][.='⁡'] and *[3][IsBracketed(., '(', ')')]))] and *[2][self::m:mn]"
      then: [T: "на"]
      else: [T: "разделить на"]
  - x: "*[2]"
  - test:
      if: "$ClearSpeak_Fractions='OverEndFrac' or ($ClearSpeak_Fractions='EndFrac' and not( ($ClearSpeak_Fractions='Auto' or $ClearSpeak_Fractions='Ordinal' or $ClearSpeak_Fractions='EndFrac') and *[1][*[1][self::m:mn][not(contains(., '.')) and ($ClearSpeak_Fractions='Ordinal' or text()<20)]   and *[2][self::m:mn][not(contains(., '.')) and ($ClearSpeak_Fractions='Ordinal' or (2<= text() and text()<=10))] ] and *[2][*[1][self::m:mn][not(contains(., '.')) and ($ClearSpeak_Fractions='Ordinal' or text()<20)]   and *[2][self::m:mn][not(contains(., '.')) and ($ClearSpeak_Fractions='Ordinal' or (2<= text() and text()<=10))] ] ) )"
      then:
      - pause: short
      - T: "конец дроби"
      - pause: short

- name: fraction-over-text
  tag: fraction
  match:
  - "not($ClearSpeak_Fractions='General' or $ClearSpeak_Fractions='GeneralEndFrac') and"
  - "( "
  - "  ((*[1][self::m:mi or self::m:mtext][string-length(.)>1]) or "
  - "   (*[1][self::m:mrow][count(*)=3][ "
  - "        *[1][self::m:mn] and "
  - "        *[2][self::m:mo][.='⁢'] and "
  - "        *[3][self::m:mi or self::m:mtext][string-length(.)>1] ]) ) and"
  - "  ((*[2][self::m:mi or self::m:mtext][string-length(.)>1]) or "
  - "   (*[2][self::m:mrow][count(*)=3][ "
  - "        *[1][self::m:mn] and "
  - "        *[2][self::m:mo][.='⁢'] and "
  - "        *[3][self::m:mi or self::m:mtext][string-length(.)>1] ]) )"
  - ")"
  replace:
  - x: "*[1]"
  - T: "на"
  - x: "*[2]"
  - test:
      if: "$ClearSpeak_Fractions='EndFrac' or $ClearSpeak_Fractions='OverEndFrac'"
      then:
      - pause: short
      - T: "конец дроби"
      - pause: short

- name: default
  tag: fraction
  match: "."
  replace:
  - ot: ""
  - T: "дробь, числитель:"
  - x: "*[1]"
  - pause: medium
  - T: "знаменатель:"
  - x: "*[2]"
  - pause: long
  - test:
      if: "$ClearSpeak_Fractions='EndFrac' or $ClearSpeak_Fractions='GeneralEndFrac'"
      then:
      - pause: short
      - T: "конец дроби"
      - pause: short

- name: ClearSpeak-function-inverse
  tag: inverse-function
  match: "."
  replace:
  - test:
    - if: $ClearSpeak_Trig = 'TrigInverse'
      then:
      - T: "обратный"
      - x: "*[1]"
    - else_if: "*[1][.='sin']"
      then: [bookmark: "*[2]/@id", T: "арксинус"]
    - else_if: "*[1][.='cos']"
      then: [bookmark: "*[2]/@id", T: "арккосинус"]
    - else_if: "*[1][.='cosh']"
      then: [bookmark: "*[2]/@id", T: "ареакосинус"]
    - else_if: "*[1][.='tan' or .='tg']"
      then: [bookmark: "*[2]/@id", T: "арктангенс"]
      else: [bookmark: "*[2]/@id", T: "обратный", x: "*[1]"]

- name: function-squared-or-cubed
  tag: power
  match:
  - "*[2][self::m:mn][.='2' or .='3'] and"
  - "following-sibling::*[1][self::m:mo][.='⁡']"
  replace:
  - x: "*[1]"
  - bookmark: "*[2]/@id"
  - test:
      if: "*[2][.='2']"
      then: [T: "в квадрате"]
      else: [T: "в кубе"]

- name: function-power
  tag: power
  match:
  - "following-sibling::*[1][self::m:mo][.='⁡']"
  replace:
  - x: "*[1]"
  - bookmark: "*[2]/@id"
  - T: "в"
  - test:
    - if: "*[2][self::m:mn][.='4']"
      then: [T: "четвёртой"]
    - else_if: "*[2][self::m:mn][not(contains(., '.'))]"
      then: [x: "ToOrdinal(*[2])"]
      else:
      - T: "степени"
      - x: "*[2]"
  - test:
      if: "*[2][self::m:mn][not(contains(., '.'))]"
      then: [T: "степени"]

- name: AfterPower-nested
  tag: power
  match:
  - "$ClearSpeak_Exponents = 'AfterPower' and"
  - "*[2][self::m:power or self::m:power or self::m:mrow[m:power]]"
  replace:
  - x: "*[1]"
  - T: "в степени (показатель:"
  - x: "*[2]"
  - pause: short
  - T: "конец показателя)"

- name: AfterPower-default
  tag: power
  match: "$ClearSpeak_Exponents = 'AfterPower'"
  replace:
  - x: "*[1]"
  - T: "в степени"
  - test:
      if: "*[2][self::m:mn][contains(., '.')]"
      then: [x: "*[2]/text()"]
      else: [x: "*[2]"]

- name: squared
  tag: power
  match: "*[2][self::m:mn][.='2'] and $ClearSpeak_Exponents = 'Auto'"
  replace:
  - x: "*[1]"
  - bookmark: "*[2]/@id"
  - T: "в квадрате"

- name: cubed
  tag: power
  match: "*[2][self::m:mn][.='3'] and $ClearSpeak_Exponents = 'Auto'"
  replace:
  - x: "*[1]"
  - bookmark: "*[2]/@id"
  - T: "в кубе"

- name: simple-integer
  tag: power
  match: "*[2][self::m:mn][not(contains(., '.'))]"
  replace:
  - x: "*[1]"
  - test:
      if: "*[2][.>=0]"
      then:
      - test:
          if: "*[2][.='2']"
          then: [T: "во"]
          else: [T: "в"]
      - x: "ToOrdinal(*[2])"
      - test:
          if: "$ClearSpeak_Exponents != 'Ordinal'"
          then: [T: "степени"]
      else:
      - T: "в степени"
      - x: "*[2]"

- name: simple-negative-integer
  tag: power
  match:
  - "*[2][self::m:minus and count(*)=1 and "
  - "     *[1][self::m:mn][not(contains(., '.'))]"
  - "    ]"
  replace:
  - x: "*[1]"
  - T: "в степени"
  - x: "*[2]"

- name: simple-var
  tag: power
  match: "*[2][self::m:mi][string-length(.)=1]"
  replace:
  - x: "*[1]"
  - T: "в степени"
  - x: "*[2]"

- name: nested-squared-or-cubed
  tag: power
  match:
  - "$ClearSpeak_Exponents = 'Auto' and"
  - "*[2][self::m:power]["
  - "     *[2][self::m:mn][.='2' or .='3'] and "
  - "     *[1][self::m:mn or self::m:mi or "
  - "          self::m:fraction[*[1][self::m:mn][not(contains(., '.')) and text()<20]   and"
  - "                        *[2][self::m:mn][not(contains(., '.')) and 2<= text() and text()<=10]]"
  - "         ]"
  - "    ]"
  replace:
  - x: "*[1]"
  - T: "в степени"
  - x: "*[2]"

- name: nested-negative-squared-or-cubed
  tag: power
  match:
  - "$ClearSpeak_Exponents = 'Auto' and"
  - " *[2][self::m:minus and count(*)=1 and "
  - "      *[1]/*[1][self::m:power]["
  - "                *[2][self::m:mn][.='2' or .='3'] and "
  - "                *[1][self::m:mn or self::m:mi or "
  - "                     self::m:fraction[*[1][self::m:mn][not(contains(., '.')) and text()<20]   and"
  - "                                   *[2][self::m:mn][not(contains(., '.')) and 2<= text() and text()<=10]]"
  - "               ]"
  - "          ]"
  - "     ]"
  replace:
  - x: "*[1]"
  - T: "в степени"
  - T: "минус"
  - x: "*[2]/*[1]"

- name: nested-var-squared-or-cubed
  tag: power
  match:
  - "$ClearSpeak_Exponents = 'Auto' and"
  - "  *[2][self::m:mrow][count(*)=3][ "
  - "       *[3][self::m:power]["
  - "            *[2][self::m:mn][.='2' or .='3'] and "
  - "            *[1][self::m:mi]"
  - "           ] and "
  - "       *[2][self::m:mo][.='⁢'] and "
  - "       *[1][self::m:mn or "
  - "            self::m:fraction[*[1][self::m:mn][not(contains(., '.')) and text()<20]   and"
  - "                          *[2][self::m:mn][not(contains(., '.')) and 2<= text() and text()<=10]]"
  - "           ]"
  - "      ]"
  replace:
  - x: "*[1]"
  - T: "в степени"
  - x: "*[2]"

- name: nested-negative-var-squared-or-cubed
  tag: power
  match:
  - "$ClearSpeak_Exponents = 'Auto' and"
  - "  *[2][self::m:mrow][count(*)=3][ "
  - "       *[3][self::m:power]["
  - "            *[2][self::m:mn][.='2' or .='3'] and "
  - "            *[1][self::m:mi]"
  - "           ] and "
  - "       *[2][self::m:mo][.='⁢'] and "
  - "       *[1][self::m:minus and count(*)=1 and "
  - "            *[1][self::m:mn or "
  - "                 self::m:fraction[*[1][self::m:mn][not(contains(., '.')) and text()<20]   and"
  - "                                  *[2][self::m:mn][not(contains(., '.')) and 2<= text() and text()<=10]]"
  - "                ]"
  - "           ]"
  - "      ]"
  replace:
  - x: "*[1]"
  - T: "в степени"
  - x: "*[2]"

- name: default-exponent-power
  tag: power
  match:
  - "*[2][self::m:power or self::m:power or self::m:mrow[m:power]]"
  replace:
  - x: "*[1]"
  - T: "в степени (показатель:"
  - x: "*[2]"
  - pause: short
  - T: "конец показателя)"

- name: default
  tag: power
  match: "."
  replace:
  - x: "*[1]"
  - T: "в степени"
  - test:
      if: "*[2][self::m:mn][contains(., '.')]"
      then: [x: "*[2]/text()"]
      else: [x: "*[2]"]

- name: ClearSpeak-double-absolute-value-as-norm
  tag: absolute-value
  match: "count(*)=1 and *[1][self::m:absolute-value]"
  replace:
  - T: "норма"
  - x: "*[1]/*[1]"
  - pause: short

- name: ClearSpeak-absolute-value
  tag: absolute-value
  match: "."
  replace:
    - test:
        if: "ancestor::*[name()='set']"
        then:
        - T: "модуль"
        - x: "*[1]"
        - pause: medium
        else:
        - test:
            if: "$Verbosity!='Terse'"
            then: [T: ""]
        - test:
            if: "$ClearSpeak_AbsoluteValue = 'Cardinality'"
            then: [T: "мощность множества"]
            else: [T: "модуль"]
        - x: "*[1]"
        - test:
            if: "$ClearSpeak_AbsoluteValue = 'AbsEnd'"
            then:
              - pause: short
              - T: "конец"
              - test:
                  if: "$ClearSpeak_AbsoluteValue = 'Cardinality'"
                  then: [T: "мощности множества"]
                  else: [T: "модуля"]
        - pause: short

- name: set
  tag: set
  match: "."
  replace:
  - test:
    - if: "count(*)=0"
      then: [T: "пустое множество"]
    - else_if: "count(*)=2"
      then:
      - test:
          if: "$Verbosity!='Terse'"
          then: [T: ""]
      - T: "пустое множество"
    - else_if: "count(*)>=7 and *[2][.='∈'] and *[4][.=':' or .='|' or .='∣']"
      then:
      - test:
          if: "$Verbosity!='Terse'"
          then: [T: ""]
      - T: "множество"
      - test:
          if: $ClearSpeak_Sets != 'woAll'
          then: [T: "всех"]
      - x: "*[1]"
      - test:
        - if: "$ClearSpeak_SetMemberSymbol='Belongs'"
          then:
          - pause: short
          - test:
              if: "*[3][.='ℕ' or .='ℤ' or .='ℚ' or .='ℝ']"
              then: [T: "входящих в множество"]
              else: [T: "входящих в"]
          - test:
            - if: "*[3][.='ℕ']"
              then: [T: "натуральных чисел"]
            - else_if: "*[3][.='ℤ']"
              then: [T: "целых чисел"]
            - else_if: "*[3][.='ℚ']"
              then: [T: "рациональных чисел"]
            - else_if: "*[3][.='ℝ']"
              then: [T: "действительных чисел"]
            - else: [x: "*[3]"]
        - else_if: "$ClearSpeak_SetMemberSymbol='Element'"
          then:
          - pause: short
          - test:
              if: "*[3][.='ℕ' or .='ℤ' or .='ℚ' or .='ℝ']"
              then: [T: "являющихся элементами множества"]
              else: [T: "являющихся элементами"]
          - test:
            - if: "*[3][.='ℕ']"
              then: [T: "натуральных чисел"]
            - else_if: "*[3][.='ℤ']"
              then: [T: "целых чисел"]
            - else_if: "*[3][.='ℚ']"
              then: [T: "рациональных чисел"]
            - else_if: "*[3][.='ℝ']"
              then: [T: "действительных чисел"]
            - else: [x: "*[3]"]
        - else_if: "$ClearSpeak_SetMemberSymbol='Auto' or $ClearSpeak_SetMemberSymbol='Member'"
          then:
          - pause: short
          - test:
              if: "*[3][.='ℕ' or .='ℤ' or .='ℚ' or .='ℝ']"
              then: [T: "принадлежащих множеству"]
              else: [T: "принадлежащих"]
          - test:
            - if: "*[3][.='ℕ']"
              then: [T: "натуральных чисел"]
            - else_if: "*[3][.='ℤ']"
              then: [T: "целых чисел"]
            - else_if: "*[3][.='ℚ']"
              then: [T: "рациональных чисел"]
            - else_if: "*[3][.='ℝ']"
              then: [T: "действительных чисел"]
            - else: [x: "*[3]"]
        - else:
          - T: "из"
          - test:
            - if: "*[3][.='ℤ']"
              then: [T: "целых чисел"]
            - else: [x: "*[3]"]
      - pause: short
      - T: "таких что"
      - x: "*[position()>4]"
    - else_if: "count(*)=3 and *[1][self::m:mrow and count(*)=3 and *[2][.='∈']] and *[2][.='|' or .='∣']"
      then:
      - test:
          if: "$Verbosity!='Terse'"
          then: [T: ""]
      - T: "множество"
      - test:
          if: $ClearSpeak_Sets != 'woAll'
          then: [T: "всех"]
      - x: "*[1]"
      - pause: short
      - T: "таких что"
      - test:
        - if: "*[3][self::m:mrow and count(*)=2 and *[2][self::m:mtext[contains(., 'even number')]]]"
          then: [x: "*[3]/*[2]"]
        - else: [x: "*[3]"]
    - else_if: "count(*[1]/*)=3 and *[1]/*[2][self::m:mo][.=':' or .='|' or .='∣']"
      then:
      - test:
          if: "$Verbosity!='Terse'"
          then: [T: ""]
      - T: "множество"
      - test:
          if: $ClearSpeak_Sets != 'woAll'
          then: [T: "всех"]
      - test:
          if: "*[1]/*[1][self::m:mi[.='x']]"
          then: [T: "икс"]
          else: [x: "*[1]/*[1]"]
      - test:
          if: "*[1]//*[.='∈']"
          then: [T: "таких что"]
          else: [T: "таких, что"]
      - test:
        - if: "*[1]/*[3][self::m:mrow and count(*)=3 and *[1][self::m:mi[.='x']]]"
          then:
          - T: "икс"
          - x: "*[1]/*[3]/*[2]"
          - x: "*[1]/*[3]/*[3]"
        - else_if: "*[1]/*[3][self::m:mrow and count(*)=3 and *[1]//*[name()='absolute-value']]"
          then:
          - T: "модуль"
          - T: "икс"
          - pause: medium
          - x: "*[1]/*[3]/*[2]"
          - x: "*[1]/*[3]/*[3]"
        - else: [x: "*[1]/*[3]"]
      else:
      - test:
          if: $ClearSpeak_Sets != 'SilentBracket'
          then:
          - test:
              if: "$Verbosity!='Terse'"
              then: [T: ""]
          - T: "множество"
      - x: "*[1]"

- name: ClearSpeak-intervals
  variables:
  - is_intervals_start_infinity: "*[1][self::m:minus and count(*)=1 and *[1][.='∞']]"
  - is_intervals_end_infinity: "*[2][.='∞'or (self::m:plus and count(*)=1 and *[1][.='∞'])]"
  tag: [open-interval, open-closed-interval, closed-interval, closed-open-interval]
  match: "."
  replace:
  - T: "интервал от"
  - test:
      if: "$is_intervals_start_infinity"
      then: [T: "минус бесконечности"]
      else: [x: "*[1]"]
  - T: "до"
  - test:
    - if: "*[2][self::m:plus and count(*)=1 and *[1][.='∞']]"
      then: [T: "плюс бесконечности"]
    - else_if: "*[2][.='∞']"
      then: [T: "бесконечности"]
      else: [x: "*[2]"]
  - pause: short
  - test:
      if: "not($is_intervals_start_infinity)"
      then:
      - test:
          if: "starts-with(name(.), 'open')"
          then: [T: "не включая"]
          else: [T: "включая"]
      - with:
          variables:
          - SpeechOverrides_CapitalLetters: "IfThenElse($SpeechOverrides_CapitalLetters='' and $Impairment='Blindness' and *[1][self::m:mi and string-length(.)=1], 'заглавную', $SpeechOverrides_CapitalLetters)"
          replace: [x: "*[1]"]
  - test:
      if: "not($is_intervals_start_infinity or $is_intervals_end_infinity)"
      then_test:
      - if: "name(.)='open-interval'"
        then: [T: "и"]
      - else_if: "name(.)='closed-interval'"
        then: [T: "и"]
        else: [pause: short, T: "но"]
  - test:
      if: not($is_intervals_end_infinity)
      then:
      - test:
          if: not( name(.)='open-interval' or name(.)='closed-interval' ) or $is_intervals_start_infinity
          then:
          - test:
              if: "name(.) = 'open-interval' or name(.) = 'closed-open-interval'"
              then: [T: "не включая"]
              else: [T: "включая"]
      - with:
          variables:
          - SpeechOverrides_CapitalLetters: "IfThenElse($SpeechOverrides_CapitalLetters='' and $Impairment='Blindness' and *[2][self::m:mi and string-length(.)=1], 'заглавную', $SpeechOverrides_CapitalLetters)"
          replace: [x: "*[2]"]

- name: binomial-frac-vector
  tag: matrix
  match:
  - "$ClearSpeak_Matrix = 'Combinatorics' and "
  - "count(*[1]/*)=1 and count(*)=2"
  replace:
  - T: "число сочетаний из"
  - x: "*[1]/*[1]/*"
  - T: "по"
  - x: "*[2]/*[1]/*"

- name: ClearSpeak-default
  tag: [mtr, mlabeledtr]
  match: "parent::m:matrix or parent::m:determinant"
  variables: [NextLineIsContinuedRow: "following-sibling::*[1][contains(@data-intent-property, ':continued-row:')]"]
  replace:
  - pause: medium
  - T: "строка"
  - x: "count(preceding-sibling::*)+1"
  - test:
      if: .[self::m:mlabeledtr]
      then:
      - T: "с меткой"
      - x: "*[1]/*"
      - pause: short
  - pause: medium
  - test:
      if: .[self::m:mlabeledtr]
      then: [x: "*[position()>1]"]
      else: {x: "*"}

- name: equality-with-root
  tag: mrow
  match:
  - "count(*)=3 and *[2][.='='] and"
  - "(*[1][self::m:mrow[m:square-root or m:root or m:msqrt or m:mroot]] or"
  - " *[3][self::m:square-root or self::m:root or self::m:msqrt or self::m:mroot])"
  replace:
  - x: "*[1]"
  - pause: medium
  - x: "*[2]"
  - pause: short
  - x: "*[3]"

- name: mixed-number
  tag: mrow
  match: "count(*)=3 and *[1][self::m:mn] and *[2][self::m:mo][.='⁤'] and *[3][self::m:fraction]"
  replace:
  - x: "*[1]"
  - T: "целых"
  - x: "*[3]"

- name: equality-with-none-implied-times
  tag: mrow
  match:
  - "count(*)=3 and *[2][.='='] and"
  - "$ClearSpeak_ImpliedTimes='None' and $ClearSpeak_Functions='None' and"
  - "*[3][self::m:mrow[*[2][.='⁢']]]"
  replace:
  - x: "*[1]"
  - pause: medium
  - x: "*[2]"
  - pause: medium
  - x: "*[3]"

- name: equality-with-piecewise
  tag: [math, mrow]
  match: "count(*[.='='])=1 and *[.='=']/following-sibling::*[1][self::m:piecewise or .//m:piecewise]"
  replace:
  - x: "*[.='=']/preceding-sibling::*"
  - x: "*[.='=']"
  - pause: medium
  - x: "*[.='=']/following-sibling::*"

- name: functions-none-plus
  tag: mrow
  match:
  - "count(*)=3 and *[2][.='+'] and $ClearSpeak_Functions='None' and"
  - "*[1][self::m:mrow[*[2][.='⁡']]] and *[3][self::m:mrow[*[2][.='⁡']]]"
  replace:
  - x: "*[1]"
  - pause: medium
  - x: "*[2]"
  - pause: short
  - x: "*[3]"

# Handle log and ln when they remain individual mi elements rather than the
# canonical three-child function-application mrow handled by the next rule.
- name: ClearSpeak-log
  tag: mi
  match: ".='log' or .='ln'"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity!='Terse' and following-sibling::*[2] and
           not(IsNode(following-sibling::*[2],'simple'))"
      then: [T: "от"]
  - test:
    - if: ".='log'"
      then: [T: "логарифм"]
    - else_if: "$ClearSpeak_Log = 'LnAsNaturalLog'"
      then: [T: "натуральный логарифм"]
      else: [T: "эл эн"]

- name: ClearSpeak-log
  tag: mrow
  variables: [{log_is_simple: "IsNode(*[3],'simple')"}]
  match:
  - "count(*)=3 and"
  - "*[1][self::m:mi][.='log' or .='ln'] and"
  - "*[2][self::m:mo][.='⁡']"
  replace:
  - test:
      if: "$log_is_simple"
      then_test:
      - if: "*[1][.='log']"
        then: [T: "логарифм"]
      - else_if: $ClearSpeak_Log = 'LnAsNaturalLog'
        then: [T: "натуральный логарифм"]
        else: [T: "эл эн"]
      else:
      - test:
          if: "$Verbosity!='Terse' and not(log_is_simple)"
          then: [T: ""]
      - test:
        - if: "*[1][.='log']"
          then: [T: "логарифм"]
        - else_if: $ClearSpeak_Log = 'LnAsNaturalLog'
          then: [T: "натуральный логарифм"]
          else: [T: "эл эн"]
      - T: "от"
  - x: "*[3]"

- name: ClearSpeak-log-with-base
  tag: mrow
  match: "count(*)=3 and *[1][self::m:logarithm-with-base] and *[2][.='⁡']"
  replace:
  - T: "логарифм"
  - x: "*[3]"
  - pause: short
  - T: "по основанию"
  - x: "*[1]/*[1]"

- name: trig-function-noninteger-power
  tag: mrow
  match:
  - "count(*)=3 and *[1][self::m:power and IsInDefinition(*[1], 'TrigFunctionNames') and not(*[2][self::m:mn])] and"
  - "*[2][.='⁡']"
  replace:
  - x: "*[1]/*[1]"
  - x: "*[3]"
  - T: "в степени"
  - x: "*[1]/*[2]"

- name: simple-parens-after-apply-or-times
  tag: mrow
  match:
  - "IsBracketed(., '(', ')') and IsNode(*[2], 'simple') and "
  - "preceding-sibling::*[1][(.='⁡' and not($ClearSpeak_Functions='None')) or (.='⁢' and not(@data-function-guess))]"
  replace:
  - x: "*[2]"

- name: functions-none-comma-arguments
  tag: mrow
  match:
  - "count(*)=3 and *[2][.=','] and $ClearSpeak_Functions='None' and"
  - "parent::*[self::m:mrow and IsBracketed(., '(', ')') and preceding-sibling::*[1][.='⁢' and @data-function-guess]]"
  replace:
  - x: "*[1]"
  - T: "запятая"
  - x: "*[3]"

- name: function-argument-parens
  tag: mrow
  match:
  - "IsBracketed(., '(', ')') and "
  - "(preceding-sibling::*[1][.='⁡'] or preceding-sibling::*[2][self::m:mi])"
  replace:
  - test:
      if: "not(IsNode(*[2], 'simple')) and
           (.//m:mo[.='+'] or preceding-sibling::*[1][@data-function-guess and $ClearSpeak_Functions='None']) and
           not(preceding-sibling::*[2][self::m:logarithm-with-base])"
      then: [pause: short]
  - test:
      if: "ancestor-or-self::*[contains(@data-intent-property, ':literal:')]"
      then: [T: "открывающая круглая скобка"]
      else_test:
      - if: ".//m:mo[.='|' or .='∣' or .='∩'] or .//m:mtext[contains(., 'and')] or .//*[contains(name(.), 'given')]"
        then: [T: "открывающая круглая скобка"]
      - else_if: "ancestor::*[self::m:fraction] and not(IsNode(*[2], 'simple'))"
        then: [T: "скобка открывается"]
      - else: [T: "скобка открывается"]
  - test:
      if: ".//m:mo[.='|' or .='∣' or .='∩'] or .//m:mtext[contains(., 'and')] or .//*[contains(name(.), 'given')]"
      then: [pause: short]
  - x: "*[2]"
  - test:
      if: "not(IsNode(*[2], 'simple'))"
      then: [pause: short]
  - test:
      if: "ancestor-or-self::*[contains(@data-intent-property, ':literal:')]"
      then: [T: "закрывающая круглая скобка"]
      else_test:
      - if: ".//m:mo[.='|' or .='∣' or .='∩'] or .//m:mtext[contains(., 'and')] or .//*[contains(name(.), 'given')]"
        then: [T: "закрывающая круглая скобка"]
      - else_if: "ancestor::*[self::m:fraction] and not(IsNode(*[2], 'simple'))"
        then: [T: "скобка закрывается"]
      - else: [T: "скобка закрывается"]
  - test:
      if: "following-sibling::*[1][.='+' or .='=']"
      then: [pause: medium]

- name: exponent-argument-parens
  tag: mrow
  match:
  - "IsBracketed(., '(', ')') and "
  - "ancestor::*[self::m:power]"
  replace:
  - test:
      if: "*[2][self::m:fraction]"
      then: [pause: medium]
  - test:
      if: "$ClearSpeak_ImpliedTimes='MoreImpliedTimes'"
      then: [T: "скобка открывается"]
      else: [T: "скобка открывается"]
  - test:
      if: "*[2][self::m:fraction]"
      then: [pause: medium]
  - x: "*[2]"
  - test:
      if: "*[2][self::m:fraction or .//m:mo[.='+' or .='-' or .='−']]"
      then: [pause: short]
  - test:
      if: "$ClearSpeak_ImpliedTimes='MoreImpliedTimes'"
      then: [T: "скобка закрывается"]
      else: [T: "скобка закрывается"]

- name: skip-equality-before-continued-gathered-line
  tag: mo
  match: ".='=' and not(following-sibling::*) and ancestor::m:lines and ancestor::m:mtr/following-sibling::*[1]//*[.='=']"
  replace: [T: ""]

- name: skip-final-period-in-multiline
  tag: mo
  match: ".='.' and not(following-sibling::*) and ancestor::m:mtr[not(following-sibling::*)] and ancestor::m:lines"
  replace: [T: ""]

- name: ClearSpeak-multi-line
  tag: [piecewise, system-of-equations, lines]
  match: "."
  variables:
  - LineCount: "count(*[not(contains(@data-intent-property, ':continued-row:'))])"
  - NextLineIsContinuedRow: "false()"
  - IsColumnSilent: true()
  replace:
  - test:
    - if: $ClearSpeak_MultiLineOverview = 'Auto'
      then:
      - x: "$LineCount"
      - test:
        - if: "($ClearSpeak_MultiLineLabel = 'Auto' and self::m:piecewise) or $ClearSpeak_MultiLineLabel = 'Case'"
          then_test:
            if: "$LineCount = 1"
            then: [T: "случай"]
            else: [T: "случая"]
        - else_if: "$ClearSpeak_MultiLineLabel = 'Auto' or $ClearSpeak_MultiLineLabel = 'Line' or $ClearSpeak_MultiLineLabel = 'None'"
          then_test:
            if: "$LineCount = 1"
            then: [T: "строка"]
            else: [T: "строки"]
        - else_if: "$ClearSpeak_MultiLineLabel = 'Constraint'"
          then_test:
            if: "$LineCount = 1"
            then: [T: "ограничение"]
            else: [T: "ограничения"]
        - else_if: "$ClearSpeak_MultiLineLabel = 'Equation'"
          then_test:
            if: "$LineCount = 1"
            then: [T: "уравнение"]
            else: [T: "уравнения"]
        - else_if: "$ClearSpeak_MultiLineLabel = 'Row'"
          then_test:
            if: "$LineCount = 1"
            then: [T: "строка"]
            else: [T: "строки"]
        - else_if: "$ClearSpeak_MultiLineLabel = 'Step'"
          then_test:
            if: "$LineCount = 1"
            then: [T: "шаг"]
            else: [T: "шага"]
      - pause: short
  - test:
      # Announce the first visual line here: intent processing may flatten that
      # row while retaining later mtr nodes.
      if: "self::m:lines and count(*) > 1"
      then:
      - T: "строка"
      - x: "1"
      - pause: medium
      - x: "*"
      else: [x: "*"]
  - pause: long

- name: ClearSpeak-default-multiline
  tag: [mtr, mlabeledtr]
  match: "parent::m:piecewise or parent::m:system-of-equations or parent::m:lines"
  variables: [NextLineIsContinuedRow: "following-sibling::*[1][contains(@data-intent-property, ':continued-row:')]"]
  replace:
  - test:
      if: "not($ClearSpeak_MultiLineLabel='None') and
           ((parent::m:lines and preceding-sibling::*) or
            (not(parent::m:lines) and
             not($LineCount=1 or contains(@data-intent-property, ':continued-row:'))))"
      then:
      - pause: medium
      - test:
        - if: "($ClearSpeak_MultiLineLabel = 'Auto' and parent::m:piecewise) or $ClearSpeak_MultiLineLabel = 'Case'"
          then: [T: "случай"]
        - else_if: "$ClearSpeak_MultiLineLabel = 'Auto' or $ClearSpeak_MultiLineLabel = 'Line'"
          then: [T: "строка"]
        - else_if: "$ClearSpeak_MultiLineLabel = 'Constraint'"
          then: [T: "ограничение"]
        - else_if: "$ClearSpeak_MultiLineLabel = 'Equation'"
          then: [T: "уравнение"]
        - else_if: "$ClearSpeak_MultiLineLabel = 'Row'"
          then: [T: "строка"]
        - else_if: "$ClearSpeak_MultiLineLabel = 'Step'"
          then: [T: "шаг"]
      - x: "IfThenElse(parent::m:lines,
                        count(preceding-sibling::*) + 1,
                        count(preceding-sibling::*[not(contains(@data-intent-property, ':continued-row:'))]) + 1)"
      - test:
          if: "self::m:mlabeledtr"
          then:
          - T: "с меткой"
          - x: "*[1]/*"
  - test:
    - if: "$ClearSpeak_MultiLineLabel='None'"
      then: [pause: long]
    - else_if: "not(contains(@data-intent-property, ':continued-row:'))"
      then: [pause: medium]
  - test:
      if: "self::m:mlabeledtr"
      then: [x: "*[position()>1]"]
      else: [x: "*"]

- name: ClearSpeak_Functions_None
  tag: mo
  match:
  - ".='⁡' and $ClearSpeak_Functions = 'None' and"
  - "not(preceding-sibling::*[1][IsInDefinition(., 'TrigFunctionNames')])"
  replace:
    test:
      if: "$ClearSpeak_ImpliedTimes = 'None'"
      then: [T: ""]
      else: [T: "умножить на"]

- name: no-times
  tag: mo
  match:
  - ".='⁢' and $ClearSpeak_ImpliedTimes = 'None'"
  replace:
  - test:
    - if: "preceding-sibling::*[1][self::m:mrow and (IsBracketed(., '(', ')') or IsBracketed(., '[', ']'))]"
      then: [pause: medium]
    - else_if: "following-sibling::*[1][self::m:mrow and (IsBracketed(., '(', ')') or IsBracketed(., '[', ']'))] and not(preceding-sibling::*[1][self::m:mi])"
      then: [pause: short]

- name: no-times-before-exponent-brackets
  tag: mo
  match: ".='⁢' and ancestor::*[self::m:power] and following-sibling::*[1][IsBracketed(., '(', ')')]"
  replace:
  - pause: medium

- name: ClearSpeak-times
  tag: mo
  match:
  - ".='⁢' and (not(@data-function-guess) or $ClearSpeak_Functions = 'None') and"
  - "not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')]) and ("
  - "  $ClearSpeak_ImpliedTimes = 'MoreImpliedTimes'"
  - " or "
  - "  ancestor::*[self::m:square-root or self::m:msqrt or self::m:root or self::m:mroot]"
  - " or "
  - "  following-sibling::*[1]["
  - "    IsBracketed(., '(', ')') or IsBracketed(., '[', ']') or IsBracketed(., '|', '|') or "
  - "    self::m:matrix or self::m:determinant or self::m:binomial or"
  - "    self::m:square-root or self::m:msqrt or self::m:root or self::m:mroot or"
  - "    (self::m:msub or self::m:msubsup or"
  - "    ((self::m:msup or self::m:power) and not(IsNode(*[1], 'leaf') and *[2][self::m:mn and (.=2 or '.=3')]))) and "
  - "     (*[1][self::m:mrow[IsBracketed(., '(', ')') or IsBracketed(., '[', ']') or IsBracketed(., '|', '|')] or "
  - "           self::m:matrix or self::m:determinant] or"
  - "      not(IsNode(*[2], 'simple')) or "
  - "      (self::m:msubsup and not(IsNode(*[3], 'simple')))"
  - "     )"
  - "  ]"
  - " or "
  - "  preceding-sibling::*[1]["
  - "    IsBracketed(., '(', ')') or IsBracketed(., '[', ']') or IsBracketed(., '|', '|')]"
  - " )"
  replace:
  - T: "умножить на"
  - test:
      if: "@data-function-guess and following-sibling::*[1][self::m:mrow and IsBracketed(., '(', ')')] and not($ClearSpeak_Functions='None')"
      then: [pause: short]

- name: no-say-parens
  tag: mrow
  match:
  - "parent::*[not(self::m:msup) and not(self::m:msub) and not(self::m:msubsup) and not(self::m:power) and"
  - "          not(self::m:math) ] and "
  - "( IsBracketed(., '(', ')') or IsBracketed(., '[', ']') ) and "
  - "not( $ClearSpeak_Functions = 'None' and "
  - "     (preceding-sibling::*[1][.='⁡'] or following-sibling::*[1][.='⁡']) ) and "
  - "not( $ClearSpeak_ImpliedTimes = 'None' and "
  - "     (preceding-sibling::*[1][.='⁢'] or following-sibling::*[1][.='⁢']) ) and "
  - "IsNode(*[2], 'simple') and"
  - "not(preceding-sibling::*[1][self::m:mi]) and"
  - "not(preceding-sibling::*[1][.='\u2062' and @data-function-guess]) and"
  - "not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')])"
  replace:
  - x: "*[2]"

- name: say-bracketed-mrow
  tag: mrow
  match: "IsBracketed(., '(', ')') or IsBracketed(., '[', ']')"
  replace:
  - test:
      if: "preceding-sibling::*[1][self::m:mi] or preceding-sibling::*[1][.='⁢' and @data-function-guess and $ClearSpeak_Functions='None']"
      then: [pause: short]
  - test:
      if: "IsBracketed(., '[', ']')"
      then: [T: "квадратная скобка открывается"]
      else_test:
        if: "ancestor-or-self::*[contains(@data-intent-property, ':literal:')] or .//m:mo[.='|' or .='∩'] or .//*[contains(., 'and')]"
        then: [T: "открывающая круглая скобка"]
        else: [T: "скобка открывается"]
  - x: "*[2]"
  - test:
      if: "IsBracketed(., '(', ')') and .//m:mo[.='+' or .='-' or .='−']"
      then: [pause: short]
  - test:
      if: "IsBracketed(., '[', ']')"
      then: [T: "квадратная скобка закрывается"]
      else_test:
        if: "ancestor-or-self::*[contains(@data-intent-property, ':literal:')] or .//m:mo[.='|' or .='∩'] or .//*[contains(., 'and')]"
        then: [T: "закрывающая круглая скобка"]
        else: [T: "скобка закрывается"]
  - test:
      if: "following-sibling::*[1][.='+' or .='=']"
      then: [pause: medium]

