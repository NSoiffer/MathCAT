---

- name: laplacian
  tag: laplacian
  match: "count(*) <= 1"   # can be on ∇^2 or on enclosing mrow
  replace:
  - T: "лапласиан"      # phrase(the 'laplacian' of a scalar field)
  - test:
      if: "count(*) = 1"
      then:
      - test:
          if: "$Verbosity!='Terse'"
          then: [T: "от"]             # phrase(the laplacian 'of' a scalar field)
      - test:
          if: "not(IsNode(*[1], 'leaf'))"
          then: [pause: short]
      - x: "*[1]"

- name: divergence
  tag: divergence
  match: "count(*) = 1"
  replace:
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "див"]             # phrase('div' is short for divergence)
      else: [T: "дивергенция"]      # phrase(the 'divergence' of a vector field)
  - test:
      if: "not(IsNode(*[1], 'simple'))"
      then: [T: "выражения"]      # Introduce a compound operand with the genitive form
  - test:
      if: "not(IsNode(*[1], 'leaf'))"
      then: [pause: short]
  - x: "*[1]"

- name: curl
  tag: curl
  match: "count(*) = 1"
  replace:
  - T: "ротор"      # phrase(the 'curl of' a field)
  - test:
      if: "not(IsNode(*[1], 'simple'))"
      then: [T: "выражения"]      # Introduce a compound operand with the genitive form
  - test:
      if: "not(IsNode(*[1], 'leaf'))"
      then: [pause: short]
  - x: "*[1]"

- name: gradient
  tag: gradient
  match: "count(*) = 1"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: "градиент"]      # phrase(the 'gradient' of a scalar field)
      else: [T: "набла"]      # Nabla is the Russian name of the gradient symbol
  - test:
      if: "not(IsNode(*[1], 'simple'))"
      then: [T: "выражения"]      # Introduce a compound operand with the genitive form
  - test:
      if: "not(IsNode(*[1], 'leaf'))"
      then: [pause: short]
  - x: "*[1]"
